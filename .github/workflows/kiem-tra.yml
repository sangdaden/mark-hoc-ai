name: Kiểm tra trang web
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Luật G6: đẩy commit mới thì hủy lần kiểm tra cũ của cùng PR
concurrency:
  group: kiem-tra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: File trò chơi data/tro-choi/*.json đọc được
        run: python3 scripts/tro_choi.py
      - name: Tạo sitemap.xml để kiểm tra (không lưu trong git)
        run: python3 scripts/tao_sitemap.py
      - name: Đủ VI + EN, có theo-doi.js, không link hỏng, JSON và sitemap đúng
        run: python3 scripts/kiem_tra_trang.py --goc "origin/${{ github.base_ref || 'main' }}"
